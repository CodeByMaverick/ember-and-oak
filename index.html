<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ember & Oak</title>
    <link rel="stylesheet" href="src/output.css">
</head>

<body>

    <nav class="fixed top-0 left-0 w-full z-50">

        <div class="flex item-center justify-between px-8 py-5">

            <a href="#" class="font-serif text-2xl font-bold text-[#FAF7F2]">
                <span>Ember</span>
                <span class="text-[#C21810]">& Oak</span>
            </a>
            <div class="flex gap-8">
                <a href="#menu">Menu</a>
                <a href="#about">About</a>
                <a href="#gallery">Gallery</a>
                <a href="#reserve">Reserve</a>
            </div>
            <button>
                Reserve a Table
            </button>

        </div>

    </nav>

    <section id="hero">

        <img src="hero.jpg" alt="Ember & Oak restaurant interior">

        <div class="hero-overlay"></div>

        <div class="hero-content">

            <p class="hero-label">Ember & Oak</p>

            <p class="hero-meta">Est. 2018 • New Delhi</p>

            <h1>
                Where Every Meal
                Tells a Story.
            </h1>

            <p class="hero-description">
                Handcrafted dishes, seasonal ingredients,
                and an atmosphere worth savouring.
            </p>

            <div class="hero-buttons">
                <a href="#reserve">Reserve a Table</a>
                <a href="#menu">View Menu</a>
            </div>

            <div class="scroll-indicator">
                <span></span>
            </div>

        </div>
    </section>

</body>

</html>
